<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1020" />
    <title>PLAN B — 이 순간, 당신의 플랜 B는?</title>
    <meta
      name="description"
      content="월드컵 명경기의 결정적 순간, 당신이 감독이라면. 전술을 다시 짜고 역사를 바꿔보세요."
    />

    <!-- 도전장 링크(#t=...)는 카톡·트위터로 공유되므로 미리보기 카드가 핵심 유입 경로다.
         크롤러는 상대 경로를 해석하지 못하므로 og:url/og:image는 배포 절대 URL로 둔다
         (배포 경로를 바꾸면 vite.config.ts BASE·nginx location과 함께 여기도 수정). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PLAN B" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:title" content="PLAN B — 이 순간, 당신의 플랜 B는?" />
    <meta
      property="og:description"
      content="월드컵 명경기의 결정적 순간, 당신이 감독이라면. 전술을 다시 짜고 역사를 바꿔보세요."
    />
    <meta property="og:url" content="https://hajin.xyz/world-cup-manager-tactics-web-challenge/" />
    <meta property="og:image" content="https://hajin.xyz/world-cup-manager-tactics-web-challenge/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="PLAN B — 이 순간, 당신의 플랜 B는?" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PLAN B — 이 순간, 당신의 플랜 B는?" />
    <meta
      name="twitter:description"
      content="월드컵 명경기의 결정적 순간, 당신이 감독이라면. 전술을 다시 짜고 역사를 바꿔보세요."
    />
    <meta name="twitter:image" content="https://hajin.xyz/world-cup-manager-tactics-web-challenge/og.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
