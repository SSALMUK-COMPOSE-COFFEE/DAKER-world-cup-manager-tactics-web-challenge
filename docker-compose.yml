services:
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      # 18080~18084는 다른 프로젝트 사용 중(portfolio, todoquest×2, nyo, media-stats)
      - "127.0.0.1:18085:80"
    restart: unless-stopped

  # 리더보드(여유 기능) 채택 시에만: docker compose --profile leaderboard up -d
  server:
    profiles: [leaderboard]
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      COOKIE_PATH: /planb
    volumes:
      - ./server-data:/data
    restart: unless-stopped
